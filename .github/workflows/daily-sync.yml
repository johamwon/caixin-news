name: Daily wenews sync

on:
  schedule:
    # 13:30 UTC = 21:30 北京时间，每晚拓展当日更新
    - cron: "30 13 * * *"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependencies
        run: pip install openpyxl   # imported via migrate_excel.ensure_schema

      - name: Run sync (fetch new articles + update knowledge graph)
        run: python wenews_sync.py sync

      # 同步过程会把库切到 WAL 模式；提交前合并 WAL 并恢复单文件模式，
      # 避免部署到 Vercel 只读文件系统后因缺少 -wal/-shm 旁支文件而打不开
      - name: Checkpoint sqlite database
        run: |
          python - <<'EOF'
          import sqlite3
          c = sqlite3.connect("caixin.db")
          c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          c.execute("PRAGMA journal_mode=DELETE")
          c.close()
          EOF

      - name: Commit updated database
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet caixin.db; then
            echo "No new articles, skip commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add caixin.db
            git commit -m "chore: daily sync $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 有新数据（或手动触发）时重新发布 Vercel 生产部署，让网站带上最新 caixin.db
      - name: Deploy to Vercel (production)
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          VERCEL_ORG_ID: team_nyN37HOSKnZ9YyHeiB7wrjCq
          VERCEL_PROJECT_ID: prj_OHw6yskl6lEgXuvHFFYfstOmVLWR
        run: npx vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
